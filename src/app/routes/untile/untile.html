<p-stepper class="container mx-auto block text-center" [value]="1" [linear]="true">
  <p-step-list>
    <p-step [value]="1">Background</p-step>
    <p-step [value]="2">Characters</p-step>
  </p-step-list>
  <p-step-panels>
    <p-step-panel [value]="1">
      <ng-template #content let-activateCallback="activateCallback">
        <div class="mb-2 flex justify-center gap-2">
          <p-fileupload [auto]="true" [customUpload]="true" (uploadHandler)="loadBg($event)" mode="basic" accept="image/*" chooseLabel="Background" chooseIcon="pi pi-upload" />
          <p-button [disabled]="!bg" (onClick)="activateCallback(2)" label="Next" icon="pi pi-arrow-right" iconPos="right" />
        </div>
        <img class="block w-full" id="bg" [src]="bg" />
      </ng-template>
    </p-step-panel>
    <p-step-panel [value]="2">
      <ng-template #content let-activateCallback="activateCallback">
        <div class="mb-2 flex justify-center gap-2">
          <p-button [disabled]="!bg" (onClick)="activateCallback(1)" label="Previous" icon="pi pi-arrow-left" iconPos="left" />
          <p-fileupload *ngIf="bg" [auto]="true" [multiple]="true" [customUpload]="true" (uploadHandler)="loadCharacters($event)" mode="basic" accept="image/*" chooseLabel="Characters" chooseIcon="pi pi-upload" />
          <p-button [disabled]="!characters.length" (onClick)="generate()" label="Generate" />
        </div>
        <div class="relative mx-auto max-w-[1000px]">
          <img #preview src="assets/img/clear.jpg" />
          <div class="absolute" [style.left]="convert(preview, { width: 22 }) + 'px'" [style.top]="convert(preview, { height: 294 }) + 'px'" [style.right]="convert(preview, { width: 48 }) + 'px'">
            <div class="grid grid-cols-7" [style.rowGap]="convert(preview, { width: 10 }) + 'px'" [style.columnGap]="convert(preview, { width: 9.5 }) + 'px'" (cdkDropListDropped)="drop($event)" cdkDropList cdkDropListOrientation="mixed">
              <div class="relative block cursor-move overflow-hidden rounded transition-shadow" *ngFor="let character of characters; let index = index" [style.width]="convert(preview, { width: 250 }) + 'px'" [style.height]="convert(preview, { width: 320 }) + 'px'" cdkDrag>
                <span class="pointer-events-none absolute left-0 top-0 block w-full text-xs">{{ character.filename }}</span>
                <img class="pointer-events-none block" [src]="character.image" />
              </div>
            </div>
          </div>
        </div>
      </ng-template>
    </p-step-panel>
  </p-step-panels>
</p-stepper>
